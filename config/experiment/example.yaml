# @package _global_

defaults:
  - override /model: llama
  - override /data: parity

logger:
  entity: "epfl-dlab"
  project: "linear_continuous_reasoning"
  tags: []

trainer:
  min_epochs: 50
  max_epochs: 100
  accumulate_grad_batches: 8

# callbacks:
#   model_checkpoint:
#     monitor: ${model.model_params.monitor}
#   early_stopping:
#     monitor: ${model.model_params.monitor}

data:
  batch_size: 8

model:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0001
    
  model_params:
    monitor: 'val/loss'
  
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    scheduler_config:
      monitor: ${model.model_params.monitor}
